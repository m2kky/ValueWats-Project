<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
    <defs>
        <linearGradient id="bg-grad-notif" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#9333ea"></stop> <!-- Violet 600 -->
            <stop offset="100%" stop-color="#4c1d95"></stop> <!-- Violet 900 -->
        </linearGradient>

        <mask id="gap-mask-notif">
            <rect width="100%" height="100%" fill="white"></rect>
            <path d="M 261 226 L 361 226 Q 391 226 391 256 L 391 316 Q 391 346 361 346 L 291 346 L 241 386 L 261 346 Q 231 346 231 316 L 231 256 Q 231 226 261 226 Z" fill="black" stroke="black" stroke-width="52" stroke-linejoin="round" stroke-linecap="round"></path>
        </mask>

        <style>
            .ping-ring {
                transform-origin: 410px 102px;
                animation: ping-anim 2s cubic-bezier(0, 0, 0.2, 1) infinite;
            }
            @keyframes ping-anim {
                0% { transform: scale(1); opacity: 0.8; }
                75%, 100% { transform: scale(2.5); opacity: 0; }
            }
        </style>
    </defs>

    <!-- Background -->
    <rect width="512" height="512" rx="115" ry="115" fill="url(#bg-grad-notif)"></rect>

    <!-- Logo Paths -->
    <path d="M 161 126 L 301 126 Q 341 126 341 166 L 341 246 Q 341 286 301 286 L 191 286 L 141 336 L 161 286 Q 121 286 121 246 L 121 166 Q 121 126 161 126 Z" fill="none" stroke="#ffffff" stroke-width="28" stroke-linejoin="round" stroke-linecap="round" mask="url(#gap-mask-notif)"></path>

    <path d="M 261 226 L 361 226 Q 391 226 391 256 L 391 316 Q 391 346 361 346 L 291 346 L 241 386 L 261 346 Q 231 346 231 316 L 231 256 Q 231 226 261 226 Z" fill="none" stroke="#ffffff" stroke-width="28" stroke-linejoin="round" stroke-linecap="round"></path>

    <!-- Unread Notification Badge (Red Dot) -->
    <!-- Background cutout for the dot to make it pop -->
    <circle cx="410" cy="102" r="52" fill="url(#bg-grad-notif)"></circle> 
    <!-- Pulsing ring -->
    <circle cx="410" cy="102" r="38" fill="#ef4444" class="ping-ring"></circle>
    <!-- Solid Dot -->
    <circle cx="410" cy="102" r="38" fill="#ef4444" stroke="#ffffff" stroke-width="8"></circle>
</svg>