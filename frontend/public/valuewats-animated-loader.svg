<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
    <defs>
        <linearGradient id="loader-grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#a855f7"></stop> <!-- Purple 500 -->
            <stop offset="100%" stop-color="#6d28d9"></stop> <!-- Violet 700 -->
        </linearGradient>

        <mask id="gap-mask-loader">
            <rect width="100%" height="100%" fill="white"></rect>
            <path d="M 261 226 L 361 226 Q 391 226 391 256 L 391 316 Q 391 346 361 346 L 291 346 L 241 386 L 261 346 Q 231 346 231 316 L 231 256 Q 231 226 261 226 Z" fill="black" stroke="black" stroke-width="52" stroke-linejoin="round" stroke-linecap="round"></path>
        </mask>

        <!-- Embedded CSS for standard React/Web compatibility without external stylesheets -->
        <style>
            .path-anim {
                stroke-dasharray: 100;
                stroke-dashoffset: 100;
                animation: draw-path 3s cubic-bezier(0.4, 0, 0.2, 1) infinite;
            }
            .path-back {
                animation-delay: 0s;
            }
            .path-front {
                animation-delay: 0.15s;
            }
            .dot {
                fill: url(#loader-grad);
                opacity: 0;
            }
            .dot-1 { animation: dot-bounce 3s infinite cubic-bezier(0.4, 0, 0.2, 1); transform-origin: 286px 286px; }
            .dot-2 { animation: dot-bounce 3s infinite cubic-bezier(0.4, 0, 0.2, 1) 0.1s; transform-origin: 311px 286px; }
            .dot-3 { animation: dot-bounce 3s infinite cubic-bezier(0.4, 0, 0.2, 1) 0.2s; transform-origin: 336px 286px; }

            @keyframes draw-path {
                0% { stroke-dashoffset: 100; opacity: 0; }
                5% { opacity: 1; stroke-dashoffset: 100; }
                40% { stroke-dashoffset: 0; opacity: 1; }
                80% { stroke-dashoffset: 0; opacity: 1; }
                90%, 100% { stroke-dashoffset: 0; opacity: 0; }
            }

            @keyframes dot-bounce {
                0%, 35% { transform: translateY(0) scale(0); opacity: 0; }
                45% { transform: translateY(-8px) scale(1.1); opacity: 1; }
                55% { transform: translateY(0) scale(1); opacity: 1; }
                80% { transform: translateY(0) scale(1); opacity: 1; }
                90%, 100% { transform: translateY(0) scale(0); opacity: 0; }
            }
        </style>
    </defs>

    <g>
        <!-- Back Bubble -->
        <path class="path-anim path-back" pathLength="100" d="M 161 126 L 301 126 Q 341 126 341 166 L 341 246 Q 341 286 301 286 L 191 286 L 141 336 L 161 286 Q 121 286 121 246 L 121 166 Q 121 126 161 126 Z" fill="none" stroke="url(#loader-grad)" stroke-width="32" stroke-linejoin="round" stroke-linecap="round" mask="url(#gap-mask-loader)"></path>

        <!-- Front Bubble -->
        <path class="path-anim path-front" pathLength="100" d="M 261 226 L 361 226 Q 391 226 391 256 L 391 316 Q 391 346 361 346 L 291 346 L 241 386 L 261 346 Q 231 346 231 316 L 231 256 Q 231 226 261 226 Z" fill="none" stroke="url(#loader-grad)" stroke-width="32" stroke-linejoin="round" stroke-linecap="round"></path>
        
        <!-- Animated Typing Dots (...) -->
        <circle cx="286" cy="286" r="14" class="dot dot-1"></circle>
        <circle cx="311" cy="286" r="14" class="dot dot-2"></circle>
        <circle cx="336" cy="286" r="14" class="dot dot-3"></circle>
    </g>
</svg>