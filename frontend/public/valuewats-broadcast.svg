<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
    <defs>
        <linearGradient id="bg-grad-br" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#4c1d95"></stop> <!-- Violet 900 -->
            <stop offset="100%" stop-color="#2e1065"></stop> <!-- Violet 950 -->
        </linearGradient>
        <mask id="gap-mask-br">
            <rect width="100%" height="100%" fill="white"></rect>
            <path d="M 261 226 L 361 226 Q 391 226 391 256 L 391 316 Q 391 346 361 346 L 291 346 L 241 386 L 261 346 Q 231 346 231 316 L 231 256 Q 231 226 261 226 Z" fill="black" stroke="black" stroke-width="52" stroke-linejoin="round" stroke-linecap="round"></path>
        </mask>
        <style>
            .wave {
                fill: none;
                stroke: #a855f7;
                transform-origin: 256px 256px;
                animation: wave-anim 3s ease-out infinite;
            }
            .w-1 { animation-delay: 0s; }
            .w-2 { animation-delay: 1s; }
            .w-3 { animation-delay: 2s; }
            @keyframes wave-anim {
                0% { r: 50px; opacity: 0.8; stroke-width: 8px; }
                100% { r: 250px; opacity: 0; stroke-width: 1px; }
            }
        </style>
    </defs>
    <rect width="512" height="512" rx="115" ry="115" fill="url(#bg-grad-br)"></rect>
    
    <!-- Expanding Waves (Radar effect) -->
    <circle cx="256" cy="256" class="wave w-1"></circle>
    <circle cx="256" cy="256" class="wave w-2"></circle>
    <circle cx="256" cy="256" class="wave w-3"></circle>

    <!-- Chat Bubbles -->
    <path d="M 161 126 L 301 126 Q 341 126 341 166 L 341 246 Q 341 286 301 286 L 191 286 L 141 336 L 161 286 Q 121 286 121 246 L 121 166 Q 121 126 161 126 Z" fill="#2e1065" stroke="#ffffff" stroke-width="28" stroke-linejoin="round" stroke-linecap="round" mask="url(#gap-mask-br)"></path>
    <path d="M 261 226 L 361 226 Q 391 226 391 256 L 391 316 Q 391 346 361 346 L 291 346 L 241 386 L 261 346 Q 231 346 231 316 L 231 256 Q 231 226 261 226 Z" fill="#2e1065" stroke="#ffffff" stroke-width="28" stroke-linejoin="round" stroke-linecap="round"></path>
</svg>