<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
    <defs>
        <linearGradient id="stroke-grad-magic" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#a855f7"></stop> <!-- Purple 500 -->
            <stop offset="100%" stop-color="#3b82f6"></stop> <!-- Blue 500 -->
        </linearGradient>

        <linearGradient id="sparkle-grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#f0abfc"></stop> <!-- Fuchsia 300 -->
            <stop offset="100%" stop-color="#c084fc"></stop> <!-- Purple 400 -->
        </linearGradient>

        <mask id="gap-mask-magic">
            <rect width="100%" height="100%" fill="white"></rect>
            <path d="M 261 226 L 361 226 Q 391 226 391 256 L 391 316 Q 391 346 361 346 L 291 346 L 241 386 L 261 346 Q 231 346 231 316 L 231 256 Q 231 226 261 226 Z" fill="black" stroke="black" stroke-width="52" stroke-linejoin="round" stroke-linecap="round"></path>
        </mask>

        <style>
            .sparkle {
                fill: url(#sparkle-grad);
                transform-origin: center;
                animation: sp-anim 2s infinite ease-in-out;
            }
            .sp-1 { animation-delay: 0s; }
            .sp-2 { animation-delay: 0.6s; }
            .sp-3 { animation-delay: 1.3s; }
            
            @keyframes sp-anim {
                0%, 100% { transform: scale(0) rotate(0deg); opacity: 0; }
                50% { transform: scale(1) rotate(90deg); opacity: 1; filter: drop-shadow(0 0 8px rgba(240, 171, 252, 0.8)); }
            }
            
            /* Gentle float for the main logo */
            .magic-logo {
                animation: float-logo 4s ease-in-out infinite;
                transform-origin: center;
            }
            @keyframes float-logo {
                0%, 100% { transform: translateY(0); }
                50% { transform: translateY(-8px); }
            }
        </style>

        <g id="sparkle-shape">
            <path d="M12 0C12 0 14.5 9.5 24 12C24 12 14.5 14.5 12 24C12 24 9.5 14.5 0 12C0 12 9.5 9.5 12 0Z"></path>
        </g>
    </defs>

    <g class="magic-logo">
        <path d="M 161 126 L 301 126 Q 341 126 341 166 L 341 246 Q 341 286 301 286 L 191 286 L 141 336 L 161 286 Q 121 286 121 246 L 121 166 Q 121 126 161 126 Z" fill="none" stroke="url(#stroke-grad-magic)" stroke-width="32" stroke-linejoin="round" stroke-linecap="round" mask="url(#gap-mask-magic)"></path>

        <path d="M 261 226 L 361 226 Q 391 226 391 256 L 391 316 Q 391 346 361 346 L 291 346 L 241 386 L 261 346 Q 231 346 231 316 L 231 256 Q 231 226 261 226 Z" fill="none" stroke="url(#stroke-grad-magic)" stroke-width="32" stroke-linejoin="round" stroke-linecap="round"></path>
    </g>

    <!-- Animated Sparkles positioned around the logo -->
    <g transform="translate(390, 80) scale(2.5)"><use href="#sparkle-shape" class="sparkle sp-1"></use></g>
    <g transform="translate(90, 360) scale(1.8)"><use href="#sparkle-shape" class="sparkle sp-2"></use></g>
    <g transform="translate(130, 70) scale(1.2)"><use href="#sparkle-shape" class="sparkle sp-3"></use></g>
</svg>