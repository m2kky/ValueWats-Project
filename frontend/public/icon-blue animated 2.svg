<?xml version="1.0" encoding="UTF-8"?>
<svg id="Layer_2" data-name="Layer 2" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 19.33 23.61">
  <defs>
    <style>
      /* إعدادات نقطة الارتكاز لضمان التكبير والتصغير من المنتصف بشكل سليم */
      .cls-1, .cls-2 {
        transform-origin: center;
        transform-box: fill-box;
      }

      /* حركة الجزء الأزرق (الخلفية): يظهر أولاً بارتداد */
      .cls-2 {
        fill: #2859af;
        opacity: 0;
        transform: scale(0);
        animation: bounceIn 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      }

      /* حركة الجزء الأبيض (الداخلي): يظهر بعد الأزرق بقليل (تأخير 0.3s) بارتداد */
      .cls-1 {
        fill: #fffed9;
        opacity: 0;
        transform: scale(0);
        animation: bounceIn 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) 0.3s forwards;
      }

      /* حركة الطفو للمجموعة كاملة بعد انتهاء الدخول (تأخير 1s) */
      #Layer_1-2 {
        animation: float 3s ease-in-out 1s infinite;
      }

      /* أنيميشن الدخول الارتدادي (Bounce In) */
      @keyframes bounceIn {
        0% { 
          transform: scale(0); 
          opacity: 0; 
        }
        100% { 
          transform: scale(1); 
          opacity: 1; 
        }
      }

      /* أنيميشن الطفو للأعلى والأسفل بهدوء (Float) */
      @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-1.5px); } /* مسافة صغيرة تتناسب مع حجم الـ viewBox */
      }
    </style>
  </defs>
