<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
    <defs>
        <linearGradient id="bg-grad-ai" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0f172a"></stop> <!-- Slate 900 -->
            <stop offset="100%" stop-color="#1e1b4b"></stop> <!-- Indigo 950 -->
        </linearGradient>

        <linearGradient id="ai-glow" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#c084fc"></stop> <!-- Purple 400 -->
            <stop offset="100%" stop-color="#7c3aed"></stop> <!-- Violet 600 -->
        </linearGradient>
    </defs>

    <rect width="512" height="512" rx="115" ry="115" fill="url(#bg-grad-ai)"></rect>

    <!-- Back Bubble (Represents Human/System) -->
    <path d="M 161 126 L 301 126 Q 341 126 341 166 L 341 246 Q 341 286 301 286 L 191 286 L 141 336 L 161 286 Q 121 286 121 246 L 121 166 Q 121 126 161 126 Z" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.2)" stroke-width="16" stroke-linejoin="round"></path>

    <!-- Front Bubble (Represents Autonomous AI Agent) -->
    <path d="M 261 226 L 361 226 Q 391 226 391 256 L 391 316 Q 391 346 361 346 L 291 346 L 241 386 L 261 346 Q 231 346 231 316 L 231 256 Q 231 226 261 226 Z" fill="url(#ai-glow)" stroke="#ffffff" stroke-width="12" stroke-linejoin="round" stroke-linecap="round"></path>
</svg>