version: "3.8"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: valuewats-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_USER: valuewats
      POSTGRES_PASSWORD: valuewats_dev_2026
      POSTGRES_DB: valuewats
    volumes:
      - valuewats_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: valuewats-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - valuewats_redis_data:/data

  agent-worker:
    build:
      context: ./backend
    command: npm run worker
    restart: unless-stopped
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://valuewats:valuewats_dev_2026@postgres:5432/valuewats?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      - postgres
      - redis

volumes:
  valuewats_postgres_data:
  valuewats_redis_data:
