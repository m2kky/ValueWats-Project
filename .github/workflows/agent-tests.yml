name: Agent tests

on: [push, pull_request]

jobs:
  agents:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: valuewats_agent_test
        ports: ['5434:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d valuewats_agent_test" --health-interval 5s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6381:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: 'backend/package-lock.json' }
      - run: npm ci
        working-directory: backend
      - run: npx prisma migrate deploy
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5434/valuewats_agent_test?schema=public
      - run: npm run test:agents
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5434/valuewats_agent_test?schema=public
          REDIS_PORT: '6381'
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
